<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise History – WorkoutLog</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <style>
    .eh-header { display:flex; align-items:center; gap:.75rem; margin-bottom:1.25rem; }
    .eh-header h2 { margin:0; font-size:1.1rem; flex:1; }
    .eh-chart-wrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1rem; margin-bottom:1.25rem; overflow:hidden; }
    .eh-chart-wrap svg { display:block; width:100%; height:160px; }
    .eh-session { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.75rem 1rem; margin-bottom:.6rem; }
    .eh-session-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:.4rem; }
    .eh-session-date { font-size:.82rem; color:var(--text-muted); }
    .eh-session-title { font-size:.82rem; font-weight:600; }
    .eh-sets { display:flex; flex-wrap:wrap; gap:.4rem; }
    .eh-set-chip { font-size:.78rem; padding:.2rem .55rem; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text-secondary); }
    .eh-empty { text-align:center; color:var(--text-muted); padding:3rem 0; }
    .eh-search { display:flex; gap:.5rem; margin-bottom:1rem; }
    .eh-search input { flex:1; padding:.5rem .75rem; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text-primary); font-size:.9rem; }
  </style>
</head>
<body class="app-page">

  <nav class="navbar">
    <a href="/workouts" class="btn-icon" style="margin-right:.25rem" title="Back">&#8249;</a>
    <span class="nav-logo">Exercise History</span>
    <div class="nav-right">
      <button class="btn btn-ghost unit-toggle" title="Switch weight units">lbs</button>
      <button id="logout-btn" class="btn-logout" title="Sign out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </nav>

  <main class="container" style="padding-bottom:6rem">
    <div class="eh-search">
      <input type="search" id="ex-name-input" placeholder="Exercise name (e.g. Back Squat)" autocomplete="off" />
      <button class="btn btn-primary btn-sm" id="ex-search-btn">Go</button>
    </div>

    <div id="eh-content"></div>
  </main>

  <script src="/static/js/main.js"></script>
  <script>
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await api("/api/users/logout", "POST");
      window.location.href = "/login";
    });

    const params = new URLSearchParams(location.search);
    const initialName = params.get("name") || "";
    const nameInput = document.getElementById("ex-name-input");
    nameInput.value = initialName;

    function toDisplayW(lbs) {
      const unit = localStorage.getItem("unit") || "lb";
      return unit === "kg" ? (lbs * 0.453592).toFixed(1) : lbs;
    }
    function unitLabel() { return localStorage.getItem("unit") === "kg" ? "kg" : "lb"; }

    function buildChart(sessions) {
      // Extract max weight per session (chronological order for chart)
      const points = sessions.slice().reverse().map(s => {
        const weights = s.sets.map(x => x.weight_lb).filter(v => v != null && v > 0);
        return { date: s.date.slice(0, 10), max: weights.length ? Math.max(...weights) : null };
      }).filter(p => p.max != null);

      if (points.length < 2) return '<p style="color:var(--text-muted);font-size:.85rem;text-align:center;padding:1rem 0">Not enough data for a chart.</p>';

      const values = points.map(p => toDisplayW(p.max));
      const minV = Math.min(...values);
      const maxV = Math.max(...values);
      const range = maxV - minV || 1;
      const W = 600, H = 140, PX = 16, PY = 12;
      const iW = W - PX * 2, iH = H - PY * 2;
      const cx = (i) => PX + (i / (points.length - 1)) * iW;
      const cy = (v) => PY + iH - ((v - minV) / range) * iH;

      const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"} ${cx(i).toFixed(1)} ${cy(values[i]).toFixed(1)}`).join(" ");
      const areaD = `${pathD} L ${cx(points.length-1).toFixed(1)} ${(PY+iH).toFixed(1)} L ${cx(0).toFixed(1)} ${(PY+iH).toFixed(1)} Z`;

      const tickCount = Math.min(points.length, 5);
      const xTicks = Array.from({length: tickCount}, (_, i) => Math.round(i * (points.length - 1) / (tickCount - 1)));
      const xTicksHtml = xTicks.map(i =>
        `<text x="${cx(i).toFixed(1)}" y="${H}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${points[i].date.slice(5)}</text>`
      ).join("");

      const yTicks = [minV, (minV + maxV) / 2, maxV].map(v => ({v, y: cy(toDisplayW(v))}));
      const yTicksHtml = yTicks.map(t =>
        `<text x="${PX - 4}" y="${t.y.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="9" fill="var(--text-muted)">${toDisplayW(t.v).toFixed(0)}</text>`
      ).join("");

      // Highlight last point
      const lastX = cx(points.length - 1), lastY = cy(values[values.length - 1]);

      return `
        <div class="eh-chart-wrap">
          <div style="font-size:.78rem;color:var(--text-muted);margin-bottom:.4rem">Max weight per session (${unitLabel()})</div>
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
            <defs>
              <linearGradient id="ehGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.25"/>
                <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path d="${areaD}" fill="url(#ehGrad)" />
            <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
            ${xTicksHtml}
            ${yTicksHtml}
            <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4" fill="var(--accent)" />
          </svg>
        </div>`;
    }

    function renderSessions(name, sessions) {
      const content = document.getElementById("eh-content");
      if (!sessions.length) {
        content.innerHTML = `<div class="eh-empty">No completed sessions found for <strong>${escapeHtml(name)}</strong>.</div>`;
        return;
      }

      const chartHtml = buildChart(sessions);

      const sessionsHtml = sessions.map(s => {
        const d = new Date(s.date + "T00:00:00");
        const label = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
        const setsHtml = s.sets.map(set => {
          const parts = [];
          if (set.reps) parts.push(`${set.reps} reps`);
          if (set.weight_lb != null) parts.push(`@ ${toDisplayW(set.weight_lb)} ${unitLabel()}`);
          return `<span class="eh-set-chip">${parts.join(" ")}</span>`;
        }).join("");
        return `
          <div class="eh-session">
            <div class="eh-session-header">
              <span class="eh-session-title">${escapeHtml(s.workout_title)}</span>
              <a href="/session/${s.workout_id}" class="eh-session-date">${label}</a>
            </div>
            <div class="eh-sets">${setsHtml || '<span style="color:var(--text-muted);font-size:.78rem">No set data</span>'}</div>
          </div>`;
      }).join("");

      content.innerHTML = `
        <div class="eh-header">
          <h2>${escapeHtml(name)}</h2>
          <span style="font-size:.82rem;color:var(--text-muted)">${sessions.length} session${sessions.length !== 1 ? "s" : ""}</span>
        </div>
        ${chartHtml}
        ${sessionsHtml}`;
    }

    async function loadHistory(name) {
      if (!name) return;
      const content = document.getElementById("eh-content");
      content.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:2rem 0">Loading…</p>';
      try {
        const data = await api(`/api/exercises/history?name=${encodeURIComponent(name)}`);
        renderSessions(data.exercise, data.sessions);
        // Update URL without reloading
        history.replaceState(null, "", `/exercise-history?name=${encodeURIComponent(name)}`);
      } catch (e) {
        content.innerHTML = '<p style="color:var(--danger);text-align:center;padding:2rem 0">Failed to load history.</p>';
      }
    }

    document.getElementById("ex-search-btn").addEventListener("click", () => {
      loadHistory(nameInput.value.trim());
    });
    nameInput.addEventListener("keydown", e => {
      if (e.key === "Enter") loadHistory(nameInput.value.trim());
    });

    initUnitToggle(() => { if (nameInput.value.trim()) loadHistory(nameInput.value.trim()); });

    if (initialName) loadHistory(initialName);
  </script>

</body>
</html>
