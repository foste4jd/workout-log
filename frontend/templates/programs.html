<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programs – WorkoutLog</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <style>
    .program-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
      margin-bottom: .75rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: .75rem;
      transition: border-color .15s;
    }
    .program-card:hover { border-color: var(--accent); }
    .program-card-info { flex: 1; min-width: 0; }
    .program-card-name { font-weight: 700; font-size: 1rem; margin-bottom: .15rem; }
    .program-card-meta { font-size: .8rem; color: var(--text-muted); }
    .program-card-desc { font-size: .82rem; color: var(--text-secondary); margin-top: .3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .program-card-actions { display: flex; gap: .4rem; flex-shrink: 0; }
    .pg-empty { color: var(--text-muted); padding: 3rem 0; }
  </style>
</head>
<body class="app-page">

  <nav class="navbar">
    <span class="nav-logo">WorkoutLog</span>
    <div class="nav-right">
      <span id="nav-username" style="display:none"></span>
      <button id="logout-btn" class="btn-logout" title="Sign out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </nav>

  <main class="container" style="padding-bottom:6rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <h2 style="margin:0;font-size:1.1rem">My Programs</h2>
      <button class="btn btn-primary btn-sm" id="new-program-btn">+ New Program</button>
    </div>
    <div id="programs-list"></div>
  </main>

  <!-- Create / Edit modal -->
  <div id="program-modal-overlay" class="modal-overlay hidden">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3 id="pm-title">New Program</h3>
        <button class="btn-icon" id="close-pm-btn">&times;</button>
      </div>
      <form id="program-form">
        <input type="hidden" id="pm-id" />
        <div class="form-group">
          <label for="pm-name">Name <span class="required">*</span></label>
          <input id="pm-name" type="text" placeholder="e.g. 5/3/1 Base" required />
        </div>
        <div class="form-group">
          <label for="pm-weeks">Total weeks</label>
          <input id="pm-weeks" type="number" min="1" max="52" value="4" />
        </div>
        <div class="form-group">
          <label for="pm-desc">Description</label>
          <textarea id="pm-desc" rows="2" placeholder="Optional notes…"></textarea>
        </div>
        <p id="pm-error" class="form-error hidden"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancel-pm-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete confirmation -->
  <div id="pg-delete-overlay" class="modal-overlay hidden">
    <div class="modal modal-sm">
      <h3>Delete program?</h3>
      <p>All days and schedule data will be lost. This can't be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancel-pgdel-btn">Cancel</button>
        <button class="btn btn-danger" id="confirm-pgdel-btn">Delete</button>
      </div>
    </div>
  </div>

  <script src="/static/js/main.js"></script>
  <script>
    document.getElementById("nav-username").textContent = "{{ username }}";
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await api("/api/users/logout", "POST");
      window.location.href = "/login";
    });

    let programs = [];
    let deletingId = null;

    async function loadPrograms() {
      programs = await api("/api/programs/") || [];
      renderPrograms();
    }

    function renderPrograms() {
      const el = document.getElementById("programs-list");
      if (!programs.length) {
        el.innerHTML = '<div class="pg-empty">No programs yet. Create one to plan your training cycle.</div>';
        return;
      }
      el.innerHTML = programs.map(p => {
        const dayCount = (p.days || []).length;
        const startStr = p.start_date
          ? new Date(p.start_date).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })
          : "No start date";
        return `
          <div class="program-card" data-id="${p.id}">
            <div class="program-card-info" onclick="window.location.href='/programs/${p.id}'">
              <div class="program-card-name">${escapeHtml(p.name)}</div>
              <div class="program-card-meta">${p.total_weeks} week${p.total_weeks !== 1 ? "s" : ""} · ${dayCount} day${dayCount !== 1 ? "s" : ""} · ${startStr}</div>
              ${p.description ? `<div class="program-card-desc">${escapeHtml(p.description)}</div>` : ""}
            </div>
            <div class="program-card-actions">
              <button class="btn-icon edit-pg-btn" data-id="${p.id}" title="Edit">&#9998;</button>
              <button class="btn-icon delete-pg-btn" data-id="${p.id}" title="Delete">&#128465;</button>
            </div>
          </div>`;
      }).join("");

      el.querySelectorAll(".edit-pg-btn").forEach(btn =>
        btn.addEventListener("click", (e) => { e.stopPropagation(); openProgramModal(parseInt(btn.dataset.id)); })
      );
      el.querySelectorAll(".delete-pg-btn").forEach(btn =>
        btn.addEventListener("click", (e) => { e.stopPropagation(); openDeleteModal(parseInt(btn.dataset.id)); })
      );
    }

    function openProgramModal(id) {
      const modal = document.getElementById("program-modal-overlay");
      const errEl = document.getElementById("pm-error");
      errEl.classList.add("hidden");
      if (id) {
        const p = programs.find(x => x.id === id);
        document.getElementById("pm-title").textContent = "Edit Program";
        document.getElementById("pm-id").value = id;
        document.getElementById("pm-name").value = p.name;
        document.getElementById("pm-weeks").value = p.total_weeks;
        document.getElementById("pm-desc").value = p.description || "";
      } else {
        document.getElementById("pm-title").textContent = "New Program";
        document.getElementById("pm-id").value = "";
        document.getElementById("pm-name").value = "";
        document.getElementById("pm-weeks").value = "4";
        document.getElementById("pm-desc").value = "";
      }
      modal.classList.remove("hidden");
    }

    function closeProgramModal() {
      document.getElementById("program-modal-overlay").classList.add("hidden");
    }

    document.getElementById("new-program-btn").addEventListener("click", () => openProgramModal(null));
    document.getElementById("close-pm-btn").addEventListener("click", closeProgramModal);
    document.getElementById("cancel-pm-btn").addEventListener("click", closeProgramModal);

    document.getElementById("program-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("pm-error");
      const id = document.getElementById("pm-id").value;
      const name = document.getElementById("pm-name").value.trim();
      if (!name) { errEl.textContent = "Name is required."; errEl.classList.remove("hidden"); return; }
      errEl.classList.add("hidden");
      const payload = {
        name,
        total_weeks: parseInt(document.getElementById("pm-weeks").value) || 4,
        description: document.getElementById("pm-desc").value.trim() || null,
      };
      try {
        if (id) {
          const updated = await api(`/api/programs/${id}`, "PUT", payload);
          programs = programs.map(p => p.id === parseInt(id) ? updated : p);
        } else {
          const created = await api("/api/programs/", "POST", payload);
          programs.unshift(created);
        }
        closeProgramModal();
        renderPrograms();
      } catch {
        errEl.textContent = "Failed to save program.";
        errEl.classList.remove("hidden");
      }
    });

    function openDeleteModal(id) {
      deletingId = id;
      document.getElementById("pg-delete-overlay").classList.remove("hidden");
    }
    document.getElementById("cancel-pgdel-btn").addEventListener("click", () => {
      document.getElementById("pg-delete-overlay").classList.add("hidden");
    });
    document.getElementById("confirm-pgdel-btn").addEventListener("click", async () => {
      if (!deletingId) return;
      await api(`/api/programs/${deletingId}`, "DELETE");
      programs = programs.filter(p => p.id !== deletingId);
      document.getElementById("pg-delete-overlay").classList.add("hidden");
      renderPrograms();
    });

    loadPrograms();
  </script>

  <nav class="bottom-nav">
    <a href="/log" class="bn-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      <span>Log</span>
    </a>
    <a href="/workouts" class="bn-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>History</span>
    </a>
    <a href="/templates" class="bn-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Templates</span>
    </a>
    <a href="/programs" class="bn-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <span>Programs</span>
    </a>
    <a href="/dashboard" class="bn-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Stats</span>
    </a>
  </nav>

</body>
</html>
